services:
  - type: web
    name: resumex-ai-platform
    env: python
    region: oregon
    plan: free
    buildCommand: pip install -r requirements.txt
    startCommand: gunicorn app:app --workers 2 --threads 4 --timeout 120
    envVars:
      - key: PYTHON_VERSION
        value: 3.11.9
      - key: FLASK_DEBUG
        value: "False"
      - key: DEMO_MODE
        value: "True"
      - key: GEMINI_API_KEY
        sync: false

